# Gate TG14 (docs/tls.md, "Updates"): fail when conda-forge has had a newer
# openssl (3.5.*) or ca-certificates than pixi.lock for more than two days.
# Daily, since the answer changes with the day and not with the code.
name: freshness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
      - name: pixi run tls-freshness
        run: pixi run tls-freshness
