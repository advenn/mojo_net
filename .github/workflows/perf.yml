# The cost check (tools/check_perf.py): instructions per request of the
# HTTP codecs under callgrind, each push against the commit before it,
# both counted on this runner. x86_64 only (valgrind; conda-forge's is
# linux-64 here). Not part of `pixi run ci`: it needs valgrind and two
# builds, and a regression it finds is a cost, not a bug.
name: perf

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bench/http/**"
      - "tools/check_perf.py"
      - ".github/workflows/perf.yml"
  pull_request:
    paths:
      - "src/**"
      - "bench/http/**"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # (the base commit, for a worktree)
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.82.1
          environments: perf
      - name: Instructions per request against the base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          pixi run -e perf perf-check --base "$BASE"
