[workspace]
authors = ["beck <qurbonovasadbek@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo_net"
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"
description = "Native Mojo networking libraries for Linux: raw syscalls (linux), bytes, TCP/UDP sockets (net), TLS through OpenSSL (tls), HTTP/1.1 (http, server), JSON (json), model API clients (llm), PostgreSQL (pg), Redis (redis); and an experimental, frozen event-loop runtime (rt)."

[tasks]
# Run all tests, or those whose path contains the given filter: `pixi run test net/`.
# Without a filter it also runs the abi-check layout test (see tools/run_tests.sh).
test = "bash tools/run_tests.sh"
# Regenerate syscall numbers, constants and errno from the kernel/C headers.
gen = "python3 tools/gen_syscall_nr.py && python3 tools/gen_abi.py --write"
# Verify committed constants and struct layouts against this host's C headers.
abi-check = "python3 tools/gen_abi.py --check && mojo run -I src build/test_abi_layout.mojo"
# Verify the I/O path imports no libc socket/poll/epoll symbols.
nolibc-check = "bash tools/check_nolibc.sh tests/linux/test_sys.mojo tests/linux/test_epoll.mojo tests/linux/test_poll.mojo tests/net/test_socket.mojo tests/net/test_tcp.mojo tests/net/test_unix.mojo tests/net/test_udp.mojo tests/tls/test_client.mojo"
# Verify the package import rules (docs/design.md, "Packages").
import-check = "python3 tools/check_imports.py"
# The tls package's OpenSSL checks (docs/tls.md, "Checks"): FFI in one
# module, an allowlist of bindings, no dangerous API, symbol versions,
# constants against the headers.
tls-check = "python3 tools/check_tls.py"
# Regenerate src/tls/consts.mojo from the environment's OpenSSL headers.
gen-tls = "python3 tools/gen_tls_consts.py --write"
# The tls tests under AddressSanitizer and LeakSanitizer (gate TG7).
tls-asan = "bash tools/check_tls_asan.sh"
# Gate TG8: the same tests against an OpenSSL built with ASan from source
# (downloaded once, pinned; not in ci, since it needs the network once).
tls-asan-openssl = "bash tools/check_tls_asan_openssl.sh"
# Gate TG2: the x509-limbo corpus through the client's verification, in
# real handshakes (downloaded once, pinned; weekly, not in ci).
tls-limbo = "bash tools/check_tls_limbo.sh"
# Whether pixi.lock's openssl and ca-certificates are current (gate TG14;
# daily in .github/workflows/freshness.yml, not in `ci`).
tls-freshness = "python3 tools/check_freshness.py"
# The json package's generated Ryū tables are current (tools/gen_ryu_tables.py);
# `gen-json` regenerates them.
json-check = "python3 tools/gen_ryu_tables.py --check"
gen-json = "python3 tools/gen_ryu_tables.py --write"
# The json tests built with AddressSanitizer (the parser is raw-pointer code).
json-asan = "bash tools/check_json_asan.sh"
# Verify the stable packages' public API (linux, bytes, net) against api/*.txt
# (docs/design.md, "Stability"); `api-update` accepts a deliberate change.
api-check = "python3 tools/check_api.py"
api-update = "python3 tools/check_api.py --write"
# Build every example, so none can rot unnoticed.
examples-check = "bash tools/check_examples.sh"
# Cross-compile every test file and example for aarch64 (objects only:
# no aarch64 host here). Slow (~10 s a file), so not part of `ci`.
aarch64-check = "bash tools/check_aarch64.sh"
# Everything CI must run: the import rules, the tls checks, the json tables,
# the stable API, every test file (which includes the ABI layout check), the
# tls tests under ASan, the no-libc check and the example builds. Set
# MOJO_NET_REQUIRE_IPV6=1 on runners with IPv6.
# TG12: the HTTPS server scanned by sslyze and testssl.sh (weekly in
# .github/workflows/tls-weekly.yml; not ci: it downloads both).
tls-interop = "bash tools/check_tls_interop.sh"
# The fuzzers longer and from a new seed, then under ASan (weekly in
# .github/workflows/fuzz.yml; not ci).
fuzz-long = "bash tools/fuzz_long.sh"
# GitHub CI runs the same tasks as parallel jobs; ci-check fails when one of
# them is missing from .github/workflows/ci.yml.
ci-check = "python3 tools/check_ci.py"
ci = { depends-on = ["ci-check", "import-check", "tls-check", "json-check", "api-check", "test", "tls-asan", "json-asan", "nolibc-check", "examples-check", "mojson-test"] }
# Re-run the M1 threading/runtime/callback spikes (see docs/spikes.md).
spikes = "bash spikes/run_spikes.sh"
# The TLS-through-OpenSSL spike (T0): checks every recorded fact.
spike-tls = "bash spikes/tls/run.sh"
# rt benchmarks against tokio (rt is frozen; see bench/rt/README.md):
# `pixi run bench build`, then `pixi run bench gate`.
bench = "bash bench/rt/run.sh"
# json on AI-shaped payloads, against Python's json (bench/json/payloads.py).
bench-json = "python3 bench/json/payloads.py write build/bench_json && python3 bench/json/corpus.py build/bench_json && mojo build -I src -o build/bench_json/bench bench/json/bench_json.mojo && build/bench_json/bench build/bench_json"
# mojson, json's API for Python on the json package (python/mojson):
# `mojson-build` builds it into build/python, `mojson-test` tests it against
# the standard library's json (tests/mojson).
mojson-build = "bash tools/build_mojson.sh"
mojson-test = "bash tools/run_mojson_tests.sh"
format = "mojo format src tests"

[dependencies]
mojo = "==1.2.0"
# TLS comes from OpenSSL (never a TLS of our own), on its 3.5 LTS line,
# supported to 2030-04-08; 3.6 loses fixes on 2026-11-01. Its libssl.so.3
# is what spikes/tls (T0) and the `tls` package load.
openssl = "3.5.*"
# Test-only: differential oracles (ipaddress) and peer processes.
python = ">=3.12"
# Test-only: a real PostgreSQL for tests/pg (initdb, pg_ctl, psql;
# tests/pg/pg_cluster.py makes a throwaway cluster per test).
postgresql = "18.*"
# Test-only: a real server for tests/redis (Valkey: BSD-licensed, and it
# speaks Redis's protocol, RESP2 and RESP3).
valkey-server = "9.*"

# The conda package (conda.recipe/recipe.yaml), built and tested by
# rattler-build in an environment of its own: `pixi run package`.
[feature.package.dependencies]
rattler-build = ">=0.77"

[feature.package.tasks]
package = "bash tools/build_package.sh"

# The HTTP server benchmark (bench/server/README.md): wrk, nginx, Go and
# Rust, pinned by pixi.lock, beside the default environment's Mojo, and
# valgrind for its profile. x86_64 only: conda-forge has no wrk for aarch64.
[feature.bench]
platforms = ["linux-64"]

[feature.bench.dependencies]
wrk = ">=4.2"
nginx = ">=1.31"
go = ">=1.27"
rust = ">=1.99"
valgrind = ">=3.27"

[feature.bench.tasks]
# Request streams read by our codec and by Go's net/http: where both read a
# request, they must agree (tools/smuggling/compare.py; weekly in fuzz.yml).
smuggling-check = "python3 tools/smuggling/compare.py"
bench-server = "python3 bench/server/run.py"
bench-profile = "python3 bench/server/profile.py"

# The cost check (tools/check_perf.py, .github/workflows/perf.yml): the
# codecs' instructions per request under callgrind, against a base commit.
[feature.perf]
platforms = ["linux-64"]

[feature.perf.dependencies]
valgrind = ">=3.27"

[feature.perf.tasks]
perf-check = "python3 tools/check_perf.py"

# Python's JSON libraries beside mojson (bench/json/compare.py): json,
# simplejson, ujson, rapidjson, orjson, msgspec, simdjson, cysimdjson, yyjson.
[feature.pyjson.pypi-dependencies]
orjson = "*"
ujson = "*"
simplejson = "*"
python-rapidjson = "*"
msgspec = "*"
pysimdjson = "*"
cysimdjson = "*"
yyjson = "*"

[feature.pyjson.tasks]
bench-json-compare = "python3 bench/json/payloads.py write build/bench_json && python3 bench/json/corpus.py build/bench_json && bash tools/build_mojson.sh && python3 bench/json/compare.py build/bench_json"
# Real documents of 0.2 to 1.2 GB and an hour of JSON Lines (bench/json/heavy.py):
# `bench-json-heavy fetch` downloads them into build/big (about 2 GB, 8 GB unpacked),
# `bench-json-heavy run [NAME...] [--libs all] [--repeat 2] [--core 3]` measures.
bench-json-heavy = "bash tools/build_mojson.sh && PYTHONPATH=build/python python3 bench/json/heavy.py"

# Releasing mojson (docs/mojson.md, "Release"): its wheel, built from
# packaging/mojson by tools/build_mojson_wheel.py and checked by twine;
# `mojson-wheel-test` installs it in a fresh virtualenv per interpreter.
# .github/workflows/mojson-wheels.yml builds both machines' wheels, tests
# them on Python 3.12 to 3.14, and publishes to TestPyPI when asked.
[feature.release.dependencies]
patchelf = "*"

[feature.release.pypi-dependencies]
twine = "*"

[feature.release.tasks]
mojson-wheel = "rm -f build/dist/mojson-*.whl && python3 tools/build_mojson_wheel.py && twine check --strict build/dist/mojson-*.whl"
mojson-wheel-test = "bash tools/test_mojson_wheel.sh build/dist"

[environments]
package = { features = ["package"], no-default-feature = true }
bench = { features = ["bench"] }
perf = { features = ["perf"] }
pyjson = { features = ["pyjson"] }
release = { features = ["release"] }
